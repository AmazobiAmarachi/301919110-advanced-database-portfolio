# Portfolio 5 - same primary/replica setup with Docker Desktop (Windows / macOS / Linux)
# Start:  docker compose up -d        Status: docker compose ps
# Primary -> localhost:5433   Replica -> localhost:5434   (password: paynaija)
services:
  primary:
    image: postgres:16
    container_name: paynaija_lagos_primary
    environment:
      POSTGRES_PASSWORD: paynaija
      POSTGRES_DB: paynaija
    command: postgres -c wal_level=replica -c max_wal_senders=10 -c hot_standby=on
    volumes:
      - ./init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  replica:
    image: postgres:16
    container_name: paynaija_abuja_replica
    user: postgres
    environment:
      PGPASSWORD: replpass
    depends_on:
      primary: { condition: service_healthy }
    command: >
      bash -c "if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
                 until pg_basebackup -h primary -U replicator -D /var/lib/postgresql/data -R -X stream -C -S abuja_slot;
                 do sleep 2; done;
                 echo \"primary_conninfo = 'host=primary user=replicator password=replpass application_name=abuja_standby'\" >> /var/lib/postgresql/data/postgresql.auto.conf;
                 chmod 0700 /var/lib/postgresql/data; fi;
               exec postgres"
    ports: ["5434:5432"]
